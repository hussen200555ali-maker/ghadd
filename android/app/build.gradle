plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "app.ghadd.guard"
    compileSdk = 34

    // توحيد هدف JVM بين Java وKotlin (شرط KGP 2.2) — JDK 17 في CI
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "app.ghadd.guard"
        // أدنى إصدار مدعوم: أندرويد 9 (API 28) — عبر مسار الالتقاط البديل
        // (MediaProjection)؛ أما أندرويد 11+ فيستخدم takeScreenshot الرسمي.
        minSdk = 28
        targetSdk = 34
        versionCode = 11
        versionName = "0.3.5"
    }

    buildTypes {
        release {
            // نموذج أولي: توقيع تصحيح فقط — استبدله بمفتاحك قبل أي توزيع علني
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}

// ملاحظة: kotlin-stdlib يأتي تلقائيًا من إصدار Kotlin في settings.gradle (2.2.20)
