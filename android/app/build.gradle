plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "app.ghadd.guard"
    compileSdk = 34

    defaultConfig {
        applicationId = "app.ghadd.guard"
        // takeScreenshot عبر خدمة إمكانية الوصول متاح من API 30 (القسم 4.6 من الوثيقة)
        minSdk = 30
        targetSdk = 34
        versionCode = 1
        versionName = "0.1.0"
    }

    buildTypes {
        release {
            // نموذج أولي: توقيع تصحيح فقط — استبدله بمفتاحك قبل أي توزيع علني
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}

