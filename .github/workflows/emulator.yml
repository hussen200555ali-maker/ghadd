name: "المحاكي السحابي — إثبات الكشف على أندرويد 9 حقيقي"

# لماذا هذا الملف؟ طلب مالك المشروع: «حاول تجربته على محاكي سحابي».
# هذا السير عمل يشغّل محاكي أندرويد حقيقي (API 28 = أندرويد 9 — نفس نظام جهاز
# سامسونج S8 الذي أبلغ عن المشكلة) على خوادم GitHub، ويثبّت التطبيق، وينفّذ
# سلسلة الكشف كاملة (المصنّف 88MB + NudeNet 51.9MB → التسجيل → TFLite → المسار الإنتاجي)،
# ثم يثبّت نسخة الإصدار الفعلية ويتحقق من إقلاعها ويلتقط لقطة شاشة دليلًا مرئيًا.
#
# ثلاث طبقات إثبات في هذا الملف:
#   1) اختبار تكامل على المحاكي: نفس مسار زر «اختبار الكشف الذاتي» حرفيًا.
#   2) فحص إقلاع نسخة الإصدار (release) — نفس الملف الذي يثبّته المستخدم.
#   3) أدلة مرفوعة كعناصر: لقطة شاشة من المحاكي + سجل logcat.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: emulator-proof
  cancel-in-progress: false

jobs:
  emulator-proof:
    name: "محاكي أندرويد 9 — إثبات سلسلة الكشف"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: تحقق من بصمة NudeNet المضمّن
        run: echo "20974db0e4bc3f158af86d9fc58315a801bbb8ba7dd26e005d6bf8b650df1e33  assets/models/nsfw_regions.tflite" | sha256sum --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      # استكمال ملفات المنصة الناقصة فقط (gradle wrapper…) — لا يلمس ملفاتنا
      - name: استكمال ملفات منصة أندرويد الناقصة
        run: flutter create --platforms=android --org app.ghadd --project-name ghadd .

      - name: جلب الاعتمادات
        run: flutter pub get

      # بناء نسخة الإصدار قبل تشغيل المحاكي — نفس الـAPK الذي يثبّته المستخدم،
      # للتأكد مبكرًا من سلامة بناء الإصدار قبل الانشغال بالمحاكي
      - name: بناء نسخة الإصدار مسبقًا
        run: flutter build apk --release

      # تمكين KVM: بدونه يطلق المشغّل المحاكي بـ -accel off (محاكاة برمجية ×100
      # أبطأ — سبب استدلال الدقائق واختناق System UI في تشغيلتَي 12:52 و15:59)
      - name: تمكين KVM للمحاكي (تسريع عتادي بدل المحاكاة البرمجية)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: تشغيل المحاكي وتنفيذ الإثبات
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072
          disable-animations: true
          script: |
            # [تنبيه بنية] المشغّل ينفّذ السكربت سطرًا سطرًا عبر sh -c — لا multi-line
            # if/fi، وset -e لا ينتقل بين الأسطر — لذلك كل سطر يحمل حكمه بنفسه،
            # وفشل الاختبار يُكشف بمقارنة نتيجته في السطر نفسه (exit 5).
            # سجل مستمر منذ أول لحظة (عملية خلفية تبقى حيّة عبر الأسطر):
            adb logcat -v time > /tmp/logcat_full.txt 2>&1 &
            echo "=== 1/3 اختبار التكامل على المحاكي (مسار زر الاختبار الذاتي) ==="
            # سقف 45 د يغطي حتى محاكيًا بلا تسريع؛ نجاح الاختبار يُحسم بنفس السطر.
            # [درس تشغيلة 17:17] Flutter 3.47 لاختبار واحد يطبع «1 test passed.»
            # لا «All tests passed!» — ففشل التحقق النصي رغم نجاح الاختبار نفسه
            # (السلسلة كلها خضراء في it_log). النمط الجديد يقبل الشكلين، ويحسم
            # الفشل الصريح «Some tests failed»، ويرفض «0 tests passed» بضراعة [1-9]:
            timeout --signal=INT --kill-after=60s 45m flutter test integration_test --device-id emulator-5554 2>&1 | tee /tmp/it_log.txt; grep -qE "(All tests passed!|[1-9][0-9]* tests? passed\.)" /tmp/it_log.txt && ! grep -q "Some tests failed" /tmp/it_log.txt || exit 5
            echo "=== 2/3 تثبيت نسخة الإصدار الفعلية والتحقق من إقلاعها ==="
            adb uninstall app.ghadd.guard || true
            adb install build/app/outputs/flutter-apk/app-release.apk
            adb shell am start -W -n app.ghadd.guard/.MainActivity
            sleep 20
            PID=$(adb shell pidof app.ghadd.guard | tr -cd '0-9'); if [ -z "$PID" ]; then echo "::error::نسخة الإصدار انهارت بعد الإقلاع على أندرويد 9!"; exit 6; fi
            echo "نسخة الإصدار تعمل على أندرويد 9 — PID: $PID"
            echo "=== 3/3 التقاط أدلة مرئية وسجلات ==="
            adb exec-out screencap -p > /tmp/ghadd-emulator.png || true
            grep -aiE "ghadd|flutter|tflite|nsfw" /tmp/logcat_full.txt | tail -300 > /tmp/logcat_ghadd.txt || true
            echo "اكتمل إثبات المحاكي بنجاح ✓"

      - name: كتابة الملخص في صفحة التشغيل
        if: always()
        run: |
          {
            echo "## نتيجة المحاكي السحابي (أندرويد 9 / API 28)"
            echo ""
            echo "- اختبار التكامل (سلسلة الكشف): انظر خطوة «تشغيل المحاكي»"
            echo "- نسخة الإصدار: تثبيت + إقلاع + بقاء عملية حيّة"
            echo "- الأدلة: عنصر «emulator-proof» أدناه (لقطة شاشة + سجلات)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: رفع أدلة التشغيل (لقطة الشاشة + السجلات)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-proof
          path: |
            /tmp/ghadd-emulator.png
            /tmp/logcat_ghadd.txt
            /tmp/it_log.txt
            /tmp/logcat_full.txt
          if-no-files-found: warn
