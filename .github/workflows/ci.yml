name: CI — بوابات غَضّ الثلاث + تصدير الـAPK

# البوابة 1: بناء + تحليل + اختبارات وحدة
# البوابة 2: رفض أي صلاحية شبكة في الـAPK عبر aapt2 + مطابقة القائمة البيضاء الموثقة
# (سبع معلنة في البيان + صلاحيتان نظاميتان تضيفهما سلسلة البناء لكل تطبيقات Flutter الحديثة)
# المُخرج: app-release.apk يُرفع كـArtifact قابل للتنزيل — وفقط بعد اجتياز بوابة الصلاحيات
# (مبنية على الصفحة 13 من وثيقة الردّ التقني — الخطوة 3)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: "البوابة 1: بناء + تحليل + اختبارات"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: تحقق من بصمة NudeNet المضمّن
        run: echo "20974db0e4bc3f158af86d9fc58315a801bbb8ba7dd26e005d6bf8b650df1e33  assets/models/nsfw_regions.tflite" | sha256sum --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # تثبيت الإصدار — قابلية تكرار البناء ومنع انحراف stable الجديد أوسط البناء
          flutter-version: 3.47.9
          cache: true

      # flutter create يكمل الملفات المنصّية الناقصة فقط (gradle wrapper، أيقونات mipmap…)
      # ولا يلمس ملفاتنا المخصصة (البيان، Kotlin، build.gradle).
      - name: استكمال ملفات منصة أندرويد الناقصة
        run: flutter create --platforms=android --org app.ghadd --project-name ghadd .

      - name: جلب الاعتمادات
        run: flutter pub get

      - name: تحليل ثابت
        run: flutter analyze

      - name: اختبارات الوحدة (عقد العتبات والعدادات)
        run: flutter test

  no-internet-gate:
    name: "البوابة 2: رفض INTERNET عبر aapt2"
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: استكمال ملفات منصة أندرويد الناقصة
        run: flutter create --platforms=android --org app.ghadd --project-name ghadd .

      - name: جلب الاعتمادات
        run: flutter pub get

      # ملاحظة مهمة: بناء --debug يضيف INTERNET تلقائيًا من أدوات Flutter (للكشف السريع)،
      # لذلك بوابة الصلاحيات تُجرى على بناء --release حصرًا — كما يفعل مستخدم الإصدار النهائي.
      - name: بناء APK نسخة الإصدار
        run: flutter build apk --release

      - name: رفض أي صلاحية شبكة + مطابقة القائمة البيضاء الموثقة
        run: |
          AAPT2=$(ls -t $ANDROID_HOME/build-tools/*/aapt2 | head -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$AAPT2" dump badging "$APK" > /tmp/badging.txt
          echo "=== الصلاحيات المعلنة في الـAPK ==="
          grep "uses-permission" /tmp/badging.txt || true

          if grep -qE "uses-permission: name='android.permission.(INTERNET|ACCESS_NETWORK_STATE)'" /tmp/badging.txt; then
            echo "::error::فشل البوابة 2: وجدت صلاحية شبكة في الـAPK — انحراف مباشر عن الوعد التأسيسي!"
            exit 1
          fi

          {
            echo "uses-permission: name='android.permission.FOREGROUND_SERVICE'"
            echo "uses-permission: name='android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION'"
            echo "uses-permission: name='android.permission.FOREGROUND_SERVICE_SPECIAL_USE'"
            echo "uses-permission: name='android.permission.POST_NOTIFICATIONS'"
            echo "uses-permission: name='android.permission.RECEIVE_BOOT_COMPLETED'"
            # [0.3.2] مقاومة النوم — حوار النظام «السماح بالعمل دائمًا في الخلفية» بيد المستخدم
            echo "uses-permission: name='android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS'"
            echo "uses-permission: name='android.permission.SYSTEM_ALERT_WINDOW'"
            # الصلاحيتان النظاميتان اللتان تضيفهما سلسلة البناء (قالب Flutter + AGP) لكل تطبيقات
            # Flutter الحديثة — بلا أي علاقة بالشبكة، وموثقتان في PRIVACY.md:
            echo "uses-permission: name='android.permission.WAKE_LOCK'"
            echo "uses-permission: name='app.ghadd.guard.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'"
          } | sort > /tmp/want.txt
          grep -oE "uses-permission: name='[^']+'" /tmp/badging.txt | sort > /tmp/got.txt

          if ! diff -u /tmp/want.txt /tmp/got.txt; then
            echo "::error::قائمة الصلاحيات اختلفت عن القائمة البيضاء الموثقة في PRIVACY.md!"
            exit 1
          fi
          echo "البوابة 2: PASS — 9 صلاحيات (7 معلنة + 2 نظاميتان من سلسلة البناء)، ولا إنترنت إطلاقًا."

      # الـAPK لا يُصدَّر إلا بعد اجتياز بوابة aapt2 — كل ملف APK يخرج من هنا مُصرّحًا
      - name: تصدير الـAPK المُصرّح به كعنصر قابل للتنزيل
        uses: actions/upload-artifact@v4
        with:
          name: ghadd-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  release:
    name: "إرفاق الـAPK بالإصدار عند الوسم v*"
    runs-on: ubuntu-latest
    needs: no-internet-gate
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: تنزيل الـAPK الذي اجتاز البوابتين
        uses: actions/download-artifact@v4
        with:
          name: ghadd-release-apk

      - name: إرفاق الـAPK بصفحة Releases
        uses: softprops/action-gh-release@v2
        with:
          files: app-release.apk
