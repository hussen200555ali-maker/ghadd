name: ghadd
description: نموذج أولي — حماية بصرية طوعية تعمل على الجهاز بالكامل، بلا صلاحية INTERNET (وثيقة الجدوى، الملحق أ)
publish_to: "none"
version: 0.2.2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # محرك الكشف الموثق في القسم 4.2 من دراسة الجدوى — نماذج مدمجة تعمل على الجهاز
  nsfw_detect: ^2.8.0
  # تخزين محلي فقط للإعدادات والإحصاءات
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # نموذج الكشف مدمج داخل الـAPK نفسه — لا تنزيل ولا شبكة إطلاقًا
    # (سبب جوهري: حزمة nsfw_detect تنزّل نماذجها افتراضيًا من الشبكة،
    #  وهو مستحيل في تطبيق بلا صلاحية INTERNET)
    - assets/models/nsfw.tflite
