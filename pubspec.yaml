name: ghadd
description: نموذج أولي — حماية بصرية طوعية تعمل على الجهاز بالكامل، بلا صلاحية INTERNET (وثيقة الجدوى، الملحق أ)
publish_to: "none"
version: 0.3.1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # محرك الكشف الموثق في القسم 4.2 من دراسة الجدوى — نماذج مدمجة تعمل على الجهاز
  # [0.2.3] نسخة مستضافة محليًا (third_party/nsfw_detect) من 2.8.0 (MIT) برقعة
  # ضرورية: محرك TFLite في الحزمة العلوية يكتب بكسلات الإدخال بصيغة HWC المتداخلة
  # دائمًا، بينما نماذج ViT المصدرية من PyTorch (FalconsaiNSFW المدمج عندنا)
  # تعلن موتّر إدخال [1,3,224,224] قنوات-أولًا — فتتشوش المستويات وتنهار الدقة
  # بصمت. الرقعة تجعل الكتابة تتبع شكل الموتّر المعلن (writePixelsShapeAware).
  # الإسناد والترخيص وشرح التغيير: third_party/nsfw_detect/VENDORED.md
  nsfw_detect:
    path: third_party/nsfw_detect
  # تخزين محلي فقط للإعدادات والإحصاءات
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # اختبارات التكامل على محاكي أندرويد حقيقي (سير عمل المحاكي السحابي) —
  # اعتمادات تطوير فقط: لا تدخل نسخة الإصدار (path_provider يُستخدم لمجلد مؤقت في الاختبار)
  integration_test:
    sdk: flutter
  path_provider: ^2.1.4

flutter:
  uses-material-design: true
  assets:
    # نموذج الكشف مدمج داخل الـAPK نفسه — لا تنزيل ولا شبكة إطلاقًا
    # (سبب جوهري: حزمة nsfw_detect تنزّل نماذجها افتراضيًا من الشبكة،
    #  وهو مستحيل في تطبيق بلا صلاحية INTERNET)
    - assets/models/nsfw.tflite
    # [0.3.0] كاشف المناطق (EraX-NSFW YOLO11n — Apache 2.0، ~10.5MB):
    # مربعات الأجزاء المكشوفة لتغطية المناطق فقط — مدمج مثل النموذج الأول
    - assets/models/nsfw_regions.tflite
